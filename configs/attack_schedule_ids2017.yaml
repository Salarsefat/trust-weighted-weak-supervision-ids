# Attack schedule of CICIDS2017, transcribed from the dataset page
#   https://www.unb.ca/cic/datasets/ids-2017.html      (retrieved 2026-10-09)
#
# CICIDS2017 is captured at one point that sees traffic before and after the firewall NAT.
# A flow is malicious if
#   (a) one endpoint is an attacker address (205.174.165.73 Kali; 205.174.165.69-71 Windows), or
#   (b) it runs between the NAT address 172.16.0.1 and the victim's local address inside an
#       attack window of that day.
# Second-stage scanning by the compromised Vista host on Thursday afternoon is Ambiguous.
# The page states no time zone; the UTC offset is estimated from the traffic (start guess:
# Atlantic Daylight Time).
dataset: CICIDS2017
source: "https://www.unb.ca/cic/datasets/ids-2017.html, retrieved 2026-10-09"
default_utc_offset_hours: -3
window_slack_seconds: 120
internal_net: "192.168.10.0/24"
nat_address: "172.16.0.1"
attacker_addresses: ["205.174.165.73", "205.174.165.69", "205.174.165.70", "205.174.165.71"]

days:
  Monday:
    date: "2017-07-03"
    family: Benign
    attacks: []

