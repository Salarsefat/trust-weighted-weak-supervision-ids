# Attack schedule of CSE-CIC-IDS2018, transcribed from Table 2 ("List of daily attacks,
# Machine IPs, Start and finish time of attack(s)") of the dataset page
#   https://www.unb.ca/cic/datasets/ids-2018.html      (retrieved 2026-10-09)
#
# The page gives start/finish times without a time zone.  Family labels therefore depend
# only on (capture day, attacker address); the time windows are used (i) to name the attack
# inside a day and (ii) for the "ambiguous" rule on the infiltration days.  The UTC offset
# of the windows is estimated from the traffic itself (twws.labels.estimate_utc_offset) and
# reported; `default_utc_offset_hours` is only the starting guess (Atlantic Standard Time).
#
# The page lists Heartbleed among the scenarios but Table 2 contains no Heartbleed entry,
# so the corpus has no Heartbleed class.
dataset: CSE-CIC-IDS2018
source: "https://www.unb.ca/cic/datasets/ids-2018.html (Table 2), retrieved 2026-10-09"
default_utc_offset_hours: -4
window_slack_seconds: 300
internal_net: "172.31.0.0/16"

days:
  Wednesday-14-02-2018:
    date: "2018-02-14"
    archive: pcap.zip
    family: BruteForce
    victims_internal: ["172.31.69.25"]
    victims_public: ["18.217.21.148"]
    attacks:
      - {name: FTP-BruteForce, start: "10:32", end: "12:09", attackers: ["172.31.70.4", "18.221.219.4"]}
      - {name: SSH-Bruteforce, start: "14:01", end: "15:31", attackers: ["172.31.70.6", "13.58.98.64"]}

